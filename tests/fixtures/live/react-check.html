<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>React controlled checkbox</title>
</head>
<body>
  <!-- React 18 受控 checkbox：onChange 只在 **click** 上触发（ChangeEventPlugin 的
       shouldUseClickEvent），所以 `check` 必须用 el.click()；直接赋值 el.checked
       会让 value tracker 吃掉变化，UI 勾上但 state 不变。 -->
  <div id="root"></div>
  <script src="./vendor/react.production.min.js"></script>
  <script src="./vendor/react-dom.production.min.js"></script>
  <script>
    window.__state = null;
    window.__changes = 0;
    const { useState, createElement } = React;
    function App() {
      const [on, setOn] = useState(false);
      window.__state = on;
      return createElement(
        'label',
        { style: { display: 'inline-block', padding: '20px' } },
        createElement('input', {
          type: 'checkbox',
          checked: on,
          onChange: (event) => {
            window.__changes += 1;
            setOn(event.target.checked);
            window.__state = event.target.checked;
          },
        }),
        ' I agree to the terms'
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(createElement(App));
  </script>
</body>
</html>
