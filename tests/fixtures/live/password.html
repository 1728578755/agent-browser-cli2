<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Password fixture</title>
</head>
<body>
  <!-- 口令/支付类字段：read / find / snapshot / scan 都不应该把明文带出来。 -->
  <form action="/submit" method="post">
    <label>User <input type="text" name="user" value="alice"></label>
    <label>Password <input type="password" name="pw" value="hunter2-secret"></label>
    <label>Card <input type="text" name="cc" autocomplete="cc-number" value="4242424242424242"></label>
    <label>Mail <input type="email" name="mail" value="alice@example.com"></label>
    <button type="button">Sign in</button>
  </form>
</body>
</html>
