name: Bug report
description: Report a reproducible defect in the atb CLI, daemon, or Chrome extension
title: "[bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please search existing issues first and remove any
        secrets, tokens, or private page content from logs before submitting.
  - type: input
    id: version
    attributes:
      label: atb version
      description: Output of `atb --version`.
      placeholder: "0.7.1"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation method
      options:
        - npm (@g1728578755/atb)
        - Prebuilt binary from GitHub Releases
        - Built from source (cargo build --release)
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS and version, browser version, Node.js version if installed via npm.
      placeholder: "Windows 11 23H2, Chrome 131, Node 20.11"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: The exact `atb` command, its exit code, and the JSON output or error.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Daemon logs (optional)
      description: Tail of the daemon log with secrets removed.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed tokens, cookies, and private page content from this report.
          required: true
