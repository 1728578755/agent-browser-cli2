<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
/* 布局（v10 审阅 PG-11）：
   旧样式写死 body{width:420px}，popup 在窄容器（分屏/小屏/侧边面板）里被裁切，
   在宽容器里又留一大片空白，且 .row 不换行 + pre 自身滚动 ⇒ 出现「页面滚 + 代码块滚」
   双层滚动。现在：
     * 宽度用 min(...) 跟随可用视口，body 永远不超出 100vw；
     * body[data-width] 支持 compact / standard / wide 三档（storage: popupWidthMode）；
     * .row 允许换行、按钮 max-width:100%、长文本 overflow-wrap:anywhere。 */
:root{color-scheme:dark}
body{width:min(420px,100vw);max-width:100%;margin:0;padding:8px;box-sizing:border-box;
  font:12px monospace;background:#1e1e1e;color:#d4d4d4;overflow-y:auto;overflow-wrap:anywhere}
body[data-width="compact"]{width:min(340px,100vw)}
body[data-width="wide"]{width:min(560px,100vw)}
h3{margin:6px 0 4px;color:#569cd6;font-size:13px}
button{background:#264f78;color:#fff;border:none;padding:4px 12px;cursor:pointer;border-radius:3px;
  margin:0 0 6px;max-width:100%}
button:hover{background:#37699e}
button:disabled{opacity:.55;cursor:default}
input{width:86px;max-width:100%;box-sizing:border-box;background:#252526;color:#d4d4d4;
  border:1px solid #3c3c3c;border-radius:3px;padding:4px;font:12px monospace}
input[type=checkbox]{width:auto;padding:0}
select{max-width:100%;background:#252526;color:#d4d4d4;border:1px solid #3c3c3c;border-radius:3px;
  padding:3px;font:12px monospace}
label{display:inline-flex;align-items:center;gap:6px;margin-right:6px;max-width:100%}
#profileLabel{width:150px}
.panel{margin-bottom:8px;padding:6px;background:#252526;border-radius:3px}
.row{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
/* 按钮组：窄窗口里整组换行，不要把一个操作的按钮拆成两行（PG-11 视觉检查）。 */
.btn-group{display:inline-flex;align-items:center;gap:6px;flex-wrap:nowrap;max-width:100%}
.status{color:#9cdcfe}
.error{color:#f48771}
.muted{color:#8f8f8f;margin-top:4px}
details{margin:4px 0}
summary{cursor:pointer;color:#9cdcfe}
pre{white-space:pre-wrap;word-break:break-all;overflow-wrap:anywhere;margin:6px 0 0;padding:6px;
  background:#252526;border-radius:3px;max-height:320px;overflow-y:auto}
[hidden]{display:none !important}
</style>
</head>
<body data-width="standard">
<h3>Bridge</h3>
<div class="panel">
  <div id="bridgeStatus" class="status" role="status" aria-live="polite">读取连接状态...</div>
  <!-- SEC-12：兼容档风险提示。文案由 popup.js 渲染（含 token 档建议）。 -->
  <div id="authWarning" class="error" role="alert" hidden></div>
  <div id="fileAccessStatus" class="status" role="status" aria-live="polite">读取文件网址权限...</div>
  <div id="wsConnectError" class="error" role="alert" hidden></div>
  <!-- SEC-12：端口/版本等可识别信息默认折叠，避免一眼看全本机环境细节。 -->
  <details>
    <summary>连接详情</summary>
    <div class="row">
      <label>端口 <input id="port" type="number" min="1" max="65535"></label>
      <button id="savePort">保存并重连</button>
    </div>
    <div id="portMsg" class="status" role="status" aria-live="polite"></div>
    <div id="wsTokenRow"></div>
    <div class="row">
      <label>popup 宽度
        <select id="widthMode">
          <option value="compact">紧凑</option>
          <option value="standard">标准</option>
          <option value="wide">宽松</option>
        </select>
      </label>
    </div>
    <div class="row">
      <span id="buildInfo" class="status">运行版本 -</span>
      <button id="reloadExt">重新加载扩展</button>
    </div>
  </details>
  <div class="row">
    <label><input id="showBadge" type="checkbox"> 在页面上显示状态角标</label>
  </div>
  <div id="showBadgeMsg" class="status" role="status" aria-live="polite"></div>
</div>
<h3>Profile</h3>
<div class="panel">
  <div id="profileStatus" class="status" role="status" aria-live="polite">读取 Profile...</div>
  <details>
    <summary>Profile 详情</summary>
    <div id="profileDetail" class="muted"></div>
  </details>
  <div class="row">
    <label>Label <input id="profileLabel" type="text" maxlength="40" placeholder="work"></label>
    <button id="saveProfileLabel">保存</button>
    <button id="clearProfileLabel">清空</button>
  </div>
  <div id="profileMsg" class="status" role="status" aria-live="polite"></div>
  <div class="muted">建议用 CLI 设置 label，可校验跨 Profile 唯一性。</div>
</div>
<h3>Cookies</h3>
<div class="panel">
  <!-- SEC-12：Cookie 操作区的权限与数据边界提示。 -->
  <div class="muted">需要 cookies 权限：仅在本机 popup 内展示，不会上传；值默认隐藏。</div>
  <div class="row">
    <button id="refresh">刷新</button>
    <button id="toggleCookies">显示值</button>
    <button id="copyCookies">复制 cookies</button>
    <label><input id="includeHttpOnly" type="checkbox"> 包含 httpOnly/secure</label>
  </div>
  <div class="row">
    <label>剪贴板自动清除
      <select id="clipboardTtl">
        <option value="30">30 秒</option>
        <option value="60">60 秒</option>
        <option value="120">120 秒</option>
        <option value="300">300 秒</option>
      </select>
    </label>
  </div>
  <div id="cookieMsg" class="status" role="status" aria-live="polite"></div>
  <pre id="out">点击「刷新」获取 cookies（默认只显示名称与标记）...</pre>
</div>
<script src="popup.js"></script>
</body>
</html>
